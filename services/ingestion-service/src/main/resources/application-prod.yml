spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

server:
  port: ${SERVER_PORT:8082}

urbanhub:
  security:
    rate-limit:
      capacity: ${INGESTION_RATE_LIMIT_CAPACITY:100}
      refill-tokens: ${INGESTION_RATE_LIMIT_REFILL_TOKENS:100}
      refill-duration-seconds: ${INGESTION_RATE_LIMIT_DURATION_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    root: INFO
    com.urbanhub.ingestion: INFO