name: EC03 UrbanHub CI-CD

on:
  push:
    branches:
      - main
    paths:
      - "services/ingestion-service/**"
      - ".github/workflows/exam-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "services/ingestion-service/**"
      - ".github/workflows/exam-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  SERVICE_DIRECTORY: services/ingestion-service

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIRECTORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            services/ingestion-service/pom.xml

      - name: Display Java and Maven versions
        run: |
          java --version
          mvn --version

      - name: Resolve Maven dependencies
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            dependency:go-offline

  test:
    name: Automated tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs:
      - install

    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIRECTORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            services/ingestion-service/pom.xml

      - name: Run tests and coverage gates
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            clean verify

      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          echo "## Automated tests" >> "$GITHUB_STEP_SUMMARY"

          if [ -d target/surefire-reports ]; then
            TESTS=$(grep -h \
              "tests=\"" \
              target/surefire-reports/TEST-*.xml \
              | sed -n 's/.* tests="\([^"]*\)".*/\1/p' \
              | awk '{ sum += $1 } END { print sum + 0 }')

            FAILURES=$(grep -h \
              "failures=\"" \
              target/surefire-reports/TEST-*.xml \
              | sed -n 's/.* failures="\([^"]*\)".*/\1/p' \
              | awk '{ sum += $1 } END { print sum + 0 }')

            ERRORS=$(grep -h \
              "errors=\"" \
              target/surefire-reports/TEST-*.xml \
              | sed -n 's/.* errors="\([^"]*\)".*/\1/p' \
              | awk '{ sum += $1 } END { print sum + 0 }')

            echo "- Tests executed: ${TESTS}" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "- Failures: ${FAILURES}" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "- Errors: ${ERRORS}" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No Surefire reports found" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f target/site/jacoco/jacoco.csv ]; then
            echo "- JaCoCo report generated successfully" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- JaCoCo report not found" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload automated test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-test-reports
          path: |
            services/ingestion-service/target/surefire-reports/
            services/ingestion-service/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
  quality:
    name: Code quality analysis
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs:
      - test

    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIRECTORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            services/ingestion-service/pom.xml

      - name: Run Checkstyle
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            checkstyle:check

      - name: Compile application for SpotBugs
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            compile

      - name: Run SpotBugs and Find Security Bugs
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            spotbugs:spotbugs

      - name: Summarize quality analysis
        if: always()
        shell: bash
        run: |
            echo "## Code quality analysis" >> "$GITHUB_STEP_SUMMARY"
            echo "- Checkstyle: executed with blocking gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- SpotBugs: executed in audit mode" >> "$GITHUB_STEP_SUMMARY"
            echo "- Find Security Bugs: enabled as SpotBugs plugin" >> "$GITHUB_STEP_SUMMARY"

            CHECKSTYLE_REPORT="target/checkstyle-result.xml"
            SPOTBUGS_REPORT="target/spotbugsXml.xml"

            if [ -f "$CHECKSTYLE_REPORT" ]; then
            CHECKSTYLE_ERRORS=$(grep -c "<error " "$CHECKSTYLE_REPORT" || true)

            echo "- Checkstyle violations: ${CHECKSTYLE_ERRORS}" \
                >> "$GITHUB_STEP_SUMMARY"
            else
            echo "- Checkstyle report not found" \
                >> "$GITHUB_STEP_SUMMARY"
            fi

            if [ -f "$SPOTBUGS_REPORT" ]; then
            SPOTBUGS_ISSUES=$(grep -c "<BugInstance" "$SPOTBUGS_REPORT" || true)

            echo "- SpotBugs findings: ${SPOTBUGS_ISSUES}" \
                >> "$GITHUB_STEP_SUMMARY"
            else
            echo "- SpotBugs report not found" \
                >> "$GITHUB_STEP_SUMMARY"
            fi

  security:
    name: DevSecOps security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - quality

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare security evidence directory
        shell: bash
        run: |
          mkdir -p artifacts/security

      - name: Scan repository secrets with Gitleaks
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            detect \
            --source=/repo \
            --report-format=sarif \
            --report-path=/repo/artifacts/security/gitleaks-report.sarif \
            --redact \
            --verbose

      - name: Scan Maven dependencies with Trivy
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.72.0 \
            fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format json \
            --output /src/artifacts/security/trivy-fs-report.json \
            /src/services/ingestion-service

      - name: Generate Trivy SARIF report
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.72.0 \
            fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format sarif \
            --output /src/artifacts/security/trivy-fs-report.sarif \
            /src/services/ingestion-service

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.72.0 \
            fs \
            --format cyclonedx \
            --output /src/artifacts/security/urbanhub-ingestion-sbom.cdx.json \
            /src/services/ingestion-service

      - name: Verify generated security evidence
        shell: bash
        run: |
          test -f artifacts/security/trivy-fs-report.json
          test -f artifacts/security/trivy-fs-report.sarif
          test -f artifacts/security/urbanhub-ingestion-sbom.cdx.json

          echo "Security evidence files generated successfully."

      - name: Summarize security results
        if: always()
        shell: bash
        run: |
          echo "## DevSecOps security analysis" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Gitleaks: blocking secret detection" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Trivy filesystem: dependency vulnerability baseline" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Trivy severities: HIGH and CRITICAL" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- CycloneDX SBOM: generated" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Trivy gate: audit mode during initial qualification" \
            >> "$GITHUB_STEP_SUMMARY"

          if [ -f artifacts/security/trivy-fs-report.json ]; then
            VULNERABILITY_COUNT=$(grep -o \
              '"VulnerabilityID"' \
              artifacts/security/trivy-fs-report.json \
              | wc -l)

            echo "- Trivy findings: ${VULNERABILITY_COUNT}" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f artifacts/security/urbanhub-ingestion-sbom.cdx.json ]; then
            echo "- SBOM status: available" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- SBOM status: missing" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-security-reports
          path: |
            artifacts/security/gitleaks-report.sarif
            artifacts/security/trivy-fs-report.json
            artifacts/security/trivy-fs-report.sarif
            artifacts/security/urbanhub-ingestion-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14