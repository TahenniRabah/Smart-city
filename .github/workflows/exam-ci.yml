name: EC03 UrbanHub CI-CD

on:
  push:
    branches:
      - main
    paths:
      - "services/ingestion-service/**"
      - ".github/workflows/exam-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "services/ingestion-service/**"
      - ".github/workflows/exam-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  SERVICE_DIRECTORY: services/ingestion-service

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIRECTORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            services/ingestion-service/pom.xml

      - name: Display Java and Maven versions
        run: |
          java --version
          mvn --version

      - name: Resolve Maven dependencies
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            dependency:go-offline

  test:
    name: Automated tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs:
      - install

    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIRECTORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            services/ingestion-service/pom.xml

      - name: Run tests and coverage gates
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            clean verify

      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          echo "## Automated tests" >> "$GITHUB_STEP_SUMMARY"

          if [ -d target/surefire-reports ]; then
            TESTS=$(grep -h \
              "tests=\"" \
              target/surefire-reports/TEST-*.xml \
              | sed -n 's/.* tests="\([^"]*\)".*/\1/p' \
              | awk '{ sum += $1 } END { print sum + 0 }')

            FAILURES=$(grep -h \
              "failures=\"" \
              target/surefire-reports/TEST-*.xml \
              | sed -n 's/.* failures="\([^"]*\)".*/\1/p' \
              | awk '{ sum += $1 } END { print sum + 0 }')

            ERRORS=$(grep -h \
              "errors=\"" \
              target/surefire-reports/TEST-*.xml \
              | sed -n 's/.* errors="\([^"]*\)".*/\1/p' \
              | awk '{ sum += $1 } END { print sum + 0 }')

            echo "- Tests executed: ${TESTS}" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "- Failures: ${FAILURES}" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "- Errors: ${ERRORS}" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No Surefire reports found" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f target/site/jacoco/jacoco.csv ]; then
            echo "- JaCoCo report generated successfully" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- JaCoCo report not found" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload automated test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-test-reports
          path: |
            services/ingestion-service/target/surefire-reports/
            services/ingestion-service/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
  quality:
    name: Code quality analysis
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs:
      - test

    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIRECTORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            services/ingestion-service/pom.xml

      - name: Run Checkstyle
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            checkstyle:check

      - name: Compile application for SpotBugs
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            compile

      - name: Run SpotBugs and Find Security Bugs
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            spotbugs:spotbugs

      - name: Summarize quality analysis
        if: always()
        shell: bash
        run: |
            echo "## Code quality analysis" >> "$GITHUB_STEP_SUMMARY"
            echo "- Checkstyle: executed with blocking gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- SpotBugs: executed in audit mode" >> "$GITHUB_STEP_SUMMARY"
            echo "- Find Security Bugs: enabled as SpotBugs plugin" >> "$GITHUB_STEP_SUMMARY"

            CHECKSTYLE_REPORT="target/checkstyle-result.xml"
            SPOTBUGS_REPORT="target/spotbugsXml.xml"

            if [ -f "$CHECKSTYLE_REPORT" ]; then
            CHECKSTYLE_ERRORS=$(grep -c "<error " "$CHECKSTYLE_REPORT" || true)

            echo "- Checkstyle violations: ${CHECKSTYLE_ERRORS}" \
                >> "$GITHUB_STEP_SUMMARY"
            else
            echo "- Checkstyle report not found" \
                >> "$GITHUB_STEP_SUMMARY"
            fi

            if [ -f "$SPOTBUGS_REPORT" ]; then
            SPOTBUGS_ISSUES=$(grep -c "<BugInstance" "$SPOTBUGS_REPORT" || true)

            echo "- SpotBugs findings: ${SPOTBUGS_ISSUES}" \
                >> "$GITHUB_STEP_SUMMARY"
            else
            echo "- SpotBugs report not found" \
                >> "$GITHUB_STEP_SUMMARY"
            fi
  
  security:
    name: DevSecOps security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - quality

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            services/ingestion-service/pom.xml

      - name: Populate Maven dependency cache
        working-directory: ${{ env.SERVICE_DIRECTORY }}
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            dependency:go-offline

      - name: Prepare security evidence directory
        shell: bash
        run: |
          mkdir -p artifacts/security

      - name: Scan repository secrets with Gitleaks
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            detect \
            --source=/repo \
            --report-format=sarif \
            --report-path=/repo/artifacts/security/gitleaks-report.sarif \
            --redact \
            --verbose

      - name: Scan Maven dependencies with Trivy
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$HOME/.m2:/root/.m2:ro" \
            -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.72.0 \
            fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format json \
            --output /src/artifacts/security/trivy-fs-report.json \
            /src/services/ingestion-service
            
      - name: Generate Trivy SARIF report
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$HOME/.m2:/root/.m2:ro" \
            -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.72.0 \
            fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format sarif \
            --output /src/artifacts/security/trivy-fs-report.sarif \
            /src/services/ingestion-service

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$HOME/.m2:/root/.m2:ro" \
            -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.72.0 \
            fs \
            --format cyclonedx \
            --output /src/artifacts/security/urbanhub-ingestion-sbom.cdx.json \
            /src/services/ingestion-service

      - name: Verify generated security evidence
        shell: bash
        run: |
          test -f artifacts/security/trivy-fs-report.json
          test -f artifacts/security/trivy-fs-report.sarif
          test -f artifacts/security/urbanhub-ingestion-sbom.cdx.json

          echo "Security evidence files generated successfully."

      - name: Summarize security results
        if: always()
        shell: bash
        run: |
          {
            echo "## DevSecOps security analysis"
            echo "- Gitleaks: blocking secret detection"
            echo "- Trivy filesystem: dependency vulnerability baseline"
            echo "- Trivy severities: HIGH and CRITICAL"
            echo "- Trivy gate: audit mode during initial qualification"
          } >> "$GITHUB_STEP_SUMMARY"

          TRIVY_REPORT="artifacts/security/trivy-fs-report.json"
          SBOM_REPORT="artifacts/security/urbanhub-ingestion-sbom.cdx.json"
          GITLEAKS_REPORT="artifacts/security/gitleaks-report.sarif"

          if [ -f "$TRIVY_REPORT" ]; then
            VULNERABILITY_COUNT=$(jq \
              '[.Results[]?.Vulnerabilities[]?] | length' \
              "$TRIVY_REPORT")

            CRITICAL_COUNT=$(jq \
              '[.Results[]?.Vulnerabilities[]? |
                select(.Severity == "CRITICAL")] | length' \
              "$TRIVY_REPORT")

            HIGH_COUNT=$(jq \
              '[.Results[]?.Vulnerabilities[]? |
                select(.Severity == "HIGH")] | length' \
              "$TRIVY_REPORT")

            {
              echo "- Trivy report: available"
              echo "- Trivy findings: ${VULNERABILITY_COUNT}"
              echo "- CRITICAL findings: ${CRITICAL_COUNT}"
              echo "- HIGH findings: ${HIGH_COUNT}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Trivy report: missing" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f "$SBOM_REPORT" ]; then
            COMPONENT_COUNT=$(jq \
              '.components // [] | length' \
              "$SBOM_REPORT")

            {
              echo "- CycloneDX SBOM: available"
              echo "- SBOM components: ${COMPONENT_COUNT}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- CycloneDX SBOM: missing" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f "$GITLEAKS_REPORT" ]; then
            GITLEAKS_COUNT=$(jq \
              '[.runs[]?.results[]?] | length' \
              "$GITLEAKS_REPORT")

            echo "- Gitleaks findings: ${GITLEAKS_COUNT}" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Gitleaks findings: 0, no report generated" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-security-reports
          path: |
            artifacts/security/gitleaks-report.sarif
            artifacts/security/trivy-fs-report.json
            artifacts/security/trivy-fs-report.sarif
            artifacts/security/urbanhub-ingestion-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14
    

  build:
    name: Build immutable Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build versioned Docker image
        run: |
          docker build \
            --tag "urbanhub-ingestion:${GITHUB_SHA}" \
            services/ingestion-service

      - name: Inspect built image
        run: |
          docker image inspect \
            "urbanhub-ingestion:${GITHUB_SHA}" \
            --format \
            'Image={{.RepoTags}} Id={{.Id}} Size={{.Size}}'

      - name: Save Docker image metadata
        run: |
          mkdir -p artifacts/build

          docker image inspect \
            "urbanhub-ingestion:${GITHUB_SHA}" \
            > artifacts/build/docker-image-inspect.json

          {
            echo "Image: urbanhub-ingestion:${GITHUB_SHA}"
            echo "Git SHA: ${GITHUB_SHA}"
            docker image ls "urbanhub-ingestion:${GITHUB_SHA}"
          } > artifacts/build/docker-build.log

      - name: Summarize Docker build
        run: |
          echo "## Docker build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`urbanhub-ingestion:${GITHUB_SHA}\`" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Versioning: immutable Git commit SHA" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Dockerfile: multi-stage Java 25 build" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime user: non-root" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-build-evidence
          path: artifacts/build/
          if-no-files-found: error
          retention-days: 14


  deploy:
    name: Local deployment and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs:
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ephemeral CI API key
        shell: bash
        run: |
          API_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$API_KEY"
          echo "INGESTION_API_KEY=$API_KEY" >> "$GITHUB_ENV"

      - name: Start Kafka and ingestion service
        shell: bash
        run: |
          docker compose up \
            --build \
            --detach \
            kafka \
            ingestion-service

      - name: Wait for ingestion readiness
        shell: bash
        run: |
          mkdir -p artifacts/deploy

          READY=false

          for attempt in $(seq 1 30); do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://localhost:8082/actuator/health/readiness \
              || true)

            echo "Attempt ${attempt}: HTTP ${STATUS}"

            if [ "$STATUS" = "200" ]; then
              READY=true
              break
            fi

            sleep 5
          done

          if [ "$READY" != "true" ]; then
            docker compose ps
            docker compose logs ingestion-service
            exit 1
          fi

          echo "Readiness smoke test: PASS" \
            | tee artifacts/deploy/readiness-test.txt

      - name: Verify unauthenticated request is rejected
        shell: bash
        run: |
          STATUS=$(curl \
            --silent \
            --output artifacts/deploy/unauthorized-response.json \
            --write-out "%{http_code}" \
            --request POST \
            http://localhost:8082/api/ingestion/measurements \
            --header "Content-Type: application/json" \
            --data '{
              "zoneId": "ZFE-1",
              "stationId": "AIR-STATION-042",
              "indicator": "NO2",
              "value": 220.5,
              "timestamp": "2026-07-27T08:00:00Z"
            }')

          echo "Unauthenticated request: HTTP ${STATUS}" \
            | tee artifacts/deploy/unauthorized-test.txt

          test "$STATUS" = "401"

      - name: Verify authenticated ingestion request
        shell: bash
        run: |
          STATUS=$(curl \
            --silent \
            --output artifacts/deploy/accepted-response.json \
            --write-out "%{http_code}" \
            --request POST \
            http://localhost:8082/api/ingestion/measurements \
            --header "Content-Type: application/json" \
            --header "X-API-Key: ${INGESTION_API_KEY}" \
            --data '{
              "zoneId": "ZFE-1",
              "stationId": "AIR-STATION-042",
              "indicator": "NO2",
              "value": 220.5,
              "timestamp": "2026-07-27T08:00:00Z"
            }')

          echo "Authenticated request: HTTP ${STATUS}" \
            | tee artifacts/deploy/authenticated-test.txt

          test "$STATUS" = "202"

      - name: Save deployment state and logs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/deploy

          docker compose ps \
            > artifacts/deploy/docker-compose-ps.txt

          docker compose logs \
            --no-color \
            ingestion-service \
            > artifacts/deploy/ingestion-service.log 2>&1 || true

          docker compose logs \
            --no-color \
            kafka \
            > artifacts/deploy/kafka.log 2>&1 || true

      - name: Summarize smoke tests
        if: success()
        shell: bash
        run: |
          echo "## Local deployment and smoke tests" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Readiness endpoint: PASS" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Request without API key: HTTP 401, PASS" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Request with valid API key: HTTP 202, PASS" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment target: local Docker Compose" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-deployment-evidence
          path: artifacts/deploy/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local deployment
        if: always()
        run: |
          docker compose down \
            --volumes \
            --remove-orphans