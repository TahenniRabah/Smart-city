name: EC03 UrbanHub CI-CD

on:
  push:
    branches:
      - main
    paths:
      - "services/ingestion-service/**"
      - ".github/workflows/exam-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "services/ingestion-service/**"
      - ".github/workflows/exam-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  SERVICE_DIRECTORY: services/ingestion-service

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIRECTORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            services/ingestion-service/pom.xml

      - name: Display Java and Maven versions
        run: |
          java --version
          mvn --version

      - name: Resolve Maven dependencies
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            dependency:go-offline

  test:
    name: Automated tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs:
      - install

    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIRECTORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            services/ingestion-service/pom.xml

      - name: Run tests and coverage gates
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            clean verify

      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          echo "## Automated tests" >> "$GITHUB_STEP_SUMMARY"

          if [ -d target/surefire-reports ]; then
            TESTS=$(grep -h \
              "tests=\"" \
              target/surefire-reports/TEST-*.xml \
              | sed -n 's/.* tests="\([^"]*\)".*/\1/p' \
              | awk '{ sum += $1 } END { print sum + 0 }')

            FAILURES=$(grep -h \
              "failures=\"" \
              target/surefire-reports/TEST-*.xml \
              | sed -n 's/.* failures="\([^"]*\)".*/\1/p' \
              | awk '{ sum += $1 } END { print sum + 0 }')

            ERRORS=$(grep -h \
              "errors=\"" \
              target/surefire-reports/TEST-*.xml \
              | sed -n 's/.* errors="\([^"]*\)".*/\1/p' \
              | awk '{ sum += $1 } END { print sum + 0 }')

            echo "- Tests executed: ${TESTS}" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "- Failures: ${FAILURES}" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "- Errors: ${ERRORS}" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No Surefire reports found" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f target/site/jacoco/jacoco.csv ]; then
            echo "- JaCoCo report generated successfully" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- JaCoCo report not found" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload automated test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-test-reports
          path: |
            services/ingestion-service/target/surefire-reports/
            services/ingestion-service/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14