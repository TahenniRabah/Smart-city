site_name: UrbanHub - Documentation technique
site_description: Documentation du service d ingestion IoT et de son pipeline CI CD
site_author: Equipe UrbanHub
site_url: ""

docs_dir: docs
site_dir: site

use_directory_urls: true
strict: true

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Activer le thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Activer le thème clair

nav:
  - Accueil: index.md
  - Tutoriel:
      - Première mesure: tutoriel.md
  - Guides pratiques:
      - Exploitation: exploitation.md
      - Pipeline CI/CD: pipeline.md
      - Dépannage: depannage.md
      - Maintenance et évolution: maintenance-evolution.md
  - Référence:
      - API REST: api.md
      - Référence technique: reference.md
  - Explications:
      - Architecture: architecture.md
      - Sécurité: securite.md
  - Diagrammes:
      - Architecture: diagrammes/architecture.md
      - Classes: diagrammes/classes.md
      - Séquence d ingestion: diagrammes/sequence-ingestion.md
  - Gouvernance:
      - Changelog: CHANGELOG.md
      - Rapport client: rapport_client.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: fr

extra:
  generator: false
  social: []

copyright: Documentation technique UrbanHub
