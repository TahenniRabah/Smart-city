name: urbanhub-smart-city

services:
  kafka:
    image: apache/kafka:latest
    container_name: urbanhub-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

    networks:
      - urbanhub-network

    restart: unless-stopped

  kafka-console:
    image: redpandadata/console:v3.9.0
    container_name: urbanhub-kafka-console

    ports:
      - "8090:8080"

    environment:
      KAFKA_BROKERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - urbanhub-network

    restart: unless-stopped

  ingestion-service:
    build:
      context: ./services/ingestion-service

    container_name: ingestion-service

    ports:
      - "8082:8082"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INGESTION_API_KEY: ${INGESTION_API_KEY}
      OPENAPI_ENABLED: "true"
      SWAGGER_ENABLED: "true"

    depends_on:
      kafka:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8082/actuator/health/readiness",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - urbanhub-network

    restart: unless-stopped

  quality-service:
    build:
      context: ./services/quality-service

    container_name: quality-service

    ports:
      - "8083:8083"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENAPI_ENABLED: "true"
      SWAGGER_ENABLED: "true"

    depends_on:
      kafka:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8083/actuator/health/readiness",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - urbanhub-network

    restart: unless-stopped

  air-quality-service:
    build:
      context: ./services/air-quality-service

    container_name: air-quality-service

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENAPI_ENABLED: "true"
      SWAGGER_ENABLED: "true"

    depends_on:
      kafka:
        condition: service_healthy
      quality-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/actuator/health/readiness",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - urbanhub-network

    restart: unless-stopped

  alerting-service:
    build:
      context: ./services/alerting-service

    container_name: alerting-service

    ports:
      - "8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENAPI_ENABLED: "true"
      SWAGGER_ENABLED: "true"

    depends_on:
      kafka:
        condition: service_healthy
      air-quality-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8081/actuator/health/readiness",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - urbanhub-network

    restart: unless-stopped

networks:
  urbanhub-network:
    driver: bridge
