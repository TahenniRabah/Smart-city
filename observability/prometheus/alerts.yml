groups:
  - name: urbanhub-ingestion-slo
    rules:
      - alert: UrbanHubHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_server_requests_seconds_bucket{job="ingestion-service",uri="/api/ingestion/measurements"}[5m])
            )
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "Latence P95 supérieure à 500 ms"
          description: "La latence P95 de l'ingestion dépasse le seuil du SLO pendant 5 minutes."
          runbook: "docs/runbook-observabilite.md#latence-p95"

      - alert: UrbanHubHighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="ingestion-service",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="ingestion-service"}[5m])), 0.001)
          > 0.01
        for: 5m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "Taux de réponses 5xx supérieur à 1 %"
          description: "Le taux d'erreur serveur menace les SLO d'acceptation et de disponibilité."
          runbook: "docs/runbook-observabilite.md#erreurs-5xx"

      - alert: UrbanHubIngestionSilent
        expr: time() - urbanhub_sensor_last_seen_epoch_seconds > 300
        for: 1m
        labels:
          severity: warning
          slo: freshness
        annotations:
          summary: "Aucune mesure acceptée depuis plus de 5 minutes"
          description: "Le flux global d'ingestion est silencieux. Vérifier la passerelle, l'API et Kafka."
          runbook: "docs/runbook-observabilite.md#flux-silencieux"

      - alert: UrbanHubKafkaPublishFailures
        expr: increase(urbanhub_kafka_publish_total{result="failure"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          slo: kafka-publication
        annotations:
          summary: "Échec de publication Kafka détecté"
          description: "Au moins une publication vers measurements.received a échoué sur les 5 dernières minutes."
          runbook: "docs/runbook-observabilite.md#publication-kafka"
