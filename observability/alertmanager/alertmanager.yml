global:
  resolve_timeout: 5m

route:
  receiver: local-webhook
  group_by: [alertname, service, severity]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: local-webhook
      repeat_interval: 30m

receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://webhook-receiver:5001/alerts
        send_resolved: true
