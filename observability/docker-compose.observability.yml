services:
  ingestion-service:
    build:
      context: ./services/ingestion-service
      dockerfile: Dockerfile.observability
    environment:
      SPRING_PROFILES_ACTIVE: prod,observability
      INGESTION_API_KEY: ${INGESTION_API_KEY:-urbanhub-local-development-key}
      OTEL_SERVICE_NAME: ingestion-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.version=0.0.1-SNAPSHOT
      JAVA_TOOL_OPTIONS: -javaagent:/opt/opentelemetry-javaagent.jar
    depends_on:
      otel-collector:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: urbanhub-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [urbanhub-network]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: urbanhub-alertmanager
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [urbanhub-network]
    depends_on: [webhook-receiver]
    restart: unless-stopped

  webhook-receiver:
    image: python:3.13-alpine
    container_name: urbanhub-alert-webhook
    working_dir: /app
    command: ["python", "/app/webhook.py"]
    volumes:
      - ./observability/alertmanager/webhook.py:/app/webhook.py:ro
      - alert-evidence:/evidence
    ports:
      - "127.0.0.1:5001:5001"
    networks: [urbanhub-network]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: urbanhub-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [urbanhub-network]
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: urbanhub-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [urbanhub-network]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: urbanhub-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks: [urbanhub-network]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: urbanhub-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    networks: [urbanhub-network]
    depends_on: [tempo, loki]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: urbanhub-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "127.0.0.1:8088:8080"
    networks: [urbanhub-network]
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  tempo-data:
  alert-evidence:
